<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha - Coyotes Basketball</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #121212;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
    }
    
    /* Proporção exata de um cartão padrão (CR80) */
    .id-card {
        width: 342px;
        height: 216px;
        background: linear-gradient(135deg, #161616 0%, #2a2a2a 100%);
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
        border: 2px solid #ff6600;
        display: flex;
        flex-direction: column;
        padding: 12px 15px;
        box-sizing: border-box;
        color: #fff;
    }

    /* Cabeçalho: Nome do time na esquerda, Logo na direita */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid #444;
        padding-bottom: 8px;
        margin-bottom: 12px;
        height: 45px;
    }

    .header-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .team-name {
        color: #ff6600;
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 1px;
        line-height: 1;
    }

    .card-title {
        font-size: 9px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 2px;
    }

    .logo {
        height: 45px;
        width: auto;
        object-fit: contain;
    }

    /* Corpo: Foto na esquerda, Dados na direita */
    .body-content {
        display: flex;
        gap: 15px;
        height: 100%;
    }

    .photo-container {
        width: 75px;
        height: 100px;
        background-color: #000;
        border: 2px solid #ff6600;
        border-radius: 6px;
        flex-shrink: 0;
        overflow: hidden;
    }

    .photo-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .info-container {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
    }

    .row {
        display: flex;
        gap: 12px;
    }

    .info-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 2px;
    }

    .label {
        font-size: 8px;
        color: #ff6600;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 1px;
    }

    .value {
        font-size: 12px;
        color: #f0f0f0;
        font-weight: 600;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div class="id-card">
    <div class="header">
        <div class="header-text">
            <h1 class="team-name">COYOTES</h1>
            <span class="card-title">Membro Oficial</span>
        </div>
        <!-- Logo do time -->
        <img src="WhatsApp_Image_2026-06-14_at_20.22.59-removebg-preview.jpg" alt="Logo Coyotes" class="logo">
    </div>
    
    <div class="body-content">
        <!-- Foto do jogador -->
        <div class="photo-container">
            <img src="https://ui-avatars.com/api/?name=Ivan+Souza&background=222&color=fff&size=150" alt="Foto de Ivan">
        </div>
        
        <!-- Dados -->
        <div class="info-container">
            <div class="info-group">
                <span class="label">Nome</span>
                <span class="value">Ivan Souza</span>
            </div>
            
            <div class="row">
                <div class="info-group">
                    <span class="label">Altura</span>
                    <span class="value">1.85m</span>
                </div>
                <div class="info-group">
                    <span class="label">Membro Desde</span>
                    <span class="value">06/2026</span>
                </div>
            </div>

            <div class="row">
                <div class="info-group">
                    <span class="label">Cidade</span>
                    <span class="value">Osasco-SP</span>
                </div>
                <div class="info-group">
                    <span class="label">Bairro</span>
                    <span class="value">Centro</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
